services:
  - type: web
    name: hansxmd-session-generator
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: hansxmd-sessions
      mountPath: /opt/render/project/src/sessions
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_DIR
        value: /opt/render/project/src/sessions
      - key: MEGA_EMAIL
        sync: false
      - key: MEGA_PASSWORD
        sync: false
